site_name: FAANG Interview Prep
site_url: https://jugaldb.github.io/faang-interview-prep/
site_description: A free, step-by-step playbook for landing big tech interviews and offers. Jobs, internships, resume, LinkedIn, outreach, online assessments, coding, 150+ company question lists, system design, behavioral, and negotiation.
site_author: Jugal Bhatt
repo_url: https://github.com/jugaldb/faang-interview-prep
repo_name: jugaldb/faang-interview-prep
edit_uri: edit/main/docs/
copyright: Built by <a href="https://jugaldb.substack.com">Jugal Bhatt</a>. Read the newsletter, Ascend, for new guides every week.

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/css/extra.css
  - assets/css/roadmap.css

extra_javascript:
  - assets/js/checklists.js
  - assets/js/roadmap-data.js
  - assets/js/roadmap.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jugaldb
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jugaldb
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/jugaldb
    - icon: fontawesome/solid/envelope
      link: https://jugaldb.substack.com

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.magiclink

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

